# 版本全部写死，不用动态版本（计划.md §14.1）。
# 取值依据：开工当日（2026-09-04）各仓库的最新 *稳定* 版；
# 唯一例外是 androidx.biometric —— 1.1.0 之后官方只出过 alpha，所以停在 1.1.0。
[versions]
# AGP 9.x 自带 Kotlin 支持，因此不单独声明 org.jetbrains.kotlin.android 插件；
# 9.3.2 是参考项目 lswlc33/photo 已在本机验证过 compileSdk 37 的版本。
agp = "9.3.2"
# KSP 2.3.11 依赖 kotlin-stdlib 2.3.20，即它是对着 Kotlin 2.3.x 编的。
# Kotlin 2.4.x 目前没有对应的 KSP，所以 Kotlin 停在 2.3 线的最后一个补丁版。
kotlin = "2.3.21"
ksp = "2.3.11"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.4"
composeBom = "2026.08.00"
activity = "1.13.0"
fragment = "1.9.0"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
work = "2.11.2"
# 1.1.0 是最后一个稳定版（之后只有 1.2.0-alpha / 1.4.0-alpha）。
# BiometricPrompt + CryptoObject + setAllowedAuthenticators(BIOMETRIC_STRONG) 都在 1.1.0 里。
biometric = "1.1.0"
# 实验期库，锁死版本；升级时先在分支里过一遍所有页面（计划.md §15.18）。
# miuix-nav 只发到 0.9.4-rc01，本项目用 androidx.navigation，不需要它。
miuix = "0.9.3"
okhttp = "5.5.0"
serializationJson = "1.11.0"
datetime = "0.8.0"
coroutines = "1.11.0"
bouncycastle = "1.85.2"
junit = "4.13.2"
turbine = "1.2.1"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# Room Gradle 插件，用来声明 schema 目录（不用 ksp arg，见 计划.md §15.9）
room = { id = "androidx.room", version.ref = "room" }

[libraries]
# --- UI: MIUIX（唯一允许在 ui/miuix/ 里 import 的库） ---
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference", version.ref = "miuix" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons", version.ref = "miuix" }
miuix-squircle = { module = "top.yukonga.miuix.kmp:miuix-squircle", version.ref = "miuix" }
# minSdk 33 才能用；低端机上是性能开销，做成可关（计划.md §15.17）
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }

# --- Compose（不引入 material3，避免与 MIUIX 两套主题打架） ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
# BiometricPrompt 要求 FragmentActivity（计划.md §15.1）
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# 切后台自动锁定要用 ProcessLifecycleOwner（计划.md §7.4）
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
# 类型安全路由需要 2.8+
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# --- 数据层 ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# --- DI ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
# HiltWorker（自动备份、定时探测）
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
# hiltViewModel()：Compose 里取带 Hilt 注入的 ViewModel（AppRoot 的锁闸要用）
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }

# --- 后台任务 ---
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

# --- 网络（OkHttp，不用 Retrofit：要构造动态 URL / 动态头 / 原始 JSON body） ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3-junit4", version.ref = "okhttp" }

# --- 序列化 / 时间 / 并发 ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- 加密 ---
# Argon2id，纯 Java 无 NDK，全 ABI 可用（计划.md §7.2）
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }

# --- 测试 ---
junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 分层规则的第二道闸。第一道是 ArchitectureRulesTest（本地 pre-commit 就会跑），
      # 这里再 grep 一遍，防的是"有人没装 hook 直接推"。
      # 放在编译之前，因为它零成本，而且违规是设计问题不是编译问题。
      - name: 架构规则检查
        run: |
          set -u
          fail=0
          src=app/src/main/java/com/lc33/tokenvault
          # 阶段2 起纯 Kotlin 包迁到 shared/src/commonMain，规则 1 要同时扫两处，
          # 否则"纯 Kotlin 层不依赖平台"这条 grep 防线就空转了。
          shared_src=shared/src/commonMain/kotlin/com/lc33/tokenvault
          check() { # check <说明> <命中即失败的命令>
            if eval "$2" > /tmp/hit 2>/dev/null && [ -s /tmp/hit ]; then
              echo "::error::$1"; sed 's/^/    /' /tmp/hit; fail=1
            fi
          }

          # 1. 八个纯 Kotlin 包：零 Android / 零 AndroidX / 零 OkHttp，且不许直接读当前时间
          pure="$src/domain $src/endpoint $src/probe $src/balance $src/catalog $src/importer $src/backup $src/crypto"
          pure_shared="$shared_src/domain $shared_src/endpoint $shared_src/probe $shared_src/balance $shared_src/catalog $shared_src/importer $shared_src/backup $shared_src/crypto"
          existing=""
          for d in $pure $pure_shared; do [ -d "$d" ] && existing="$existing $d"; done
          if [ -n "$existing" ]; then
            check "纯 Kotlin 层出现了平台依赖（计划.md 红线 20）" \
              "grep -rnE 'import (android|androidx)\.|import okhttp3\.|Clock\.System' $existing --include='*.kt'"
          fi

          # 2. 只有 ui/miuix 能 import MIUIX（实验期库，升级时只改这一层）
          check "ui/miuix 之外直接 import 了 MIUIX（计划.md §4.3）" \
            "grep -rn 'import top.yukonga.miuix' $src --include='*.kt' | grep -v '/ui/miuix/'"

          # 3. MIUIX 的 Window* 弹层一律禁用：独立系统窗口，FLAG_SECURE 不继承
          check "用了 MIUIX 的 Window* 弹层（计划.md §7.5、§13.2）" \
            "grep -rnE 'Window(Dialog|BottomSheet|[A-Za-z]*Popup|[A-Za-z]*Menu|[A-Za-z]*Preference)' $src --include='*.kt'"

          # 4. screens/ 不碰 SQL，也不构造 HTTP 请求
          if [ -d "$src/screens" ]; then
            check "screens/ 里出现 SQL 或 HTTP 构造（计划.md §4.3）" \
              "grep -rnE '(SELECT |INSERT +INTO|UPDATE +[A-Za-z_]+ +SET|DELETE +FROM|CREATE +TABLE|Request\.Builder)' $src/screens --include='*.kt'"
          fi

          # 5. 真实凭据永不入库。src/test/ 与 src/androidTest/ 里的 sk-TEST… 是测试占位符，
          #    与 pre-commit 一致地豁免：真实密钥泄露的风险在主代码与文档里。
          check "仓库里出现疑似真实 API 密钥的字面量（计划.md §0）" \
            "grep -rnE 'sk-[A-Za-z0-9]{20,}' app gradle --include='*.kt' --include='*.kts' --include='*.xml' --include='*.toml' --exclude-dir=test --exclude-dir=androidTest"
          if git ls-files --error-unmatch '示例数据.md' > /dev/null 2>&1; then
            echo "::error::示例数据.md 被提交进了仓库（计划.md §0）"; fail=1
          fi

          exit $fail

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Android 17 的 platform 包名是 `android-37.0`（带 minor 版本号，与 build-tools
          # 的 37.0.0 对齐），不是 `android-37`——后者在 sdkmanager 里根本不存在。
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      # 缓存 Gradle 依赖与构建缓存，跨 run 复用，后续构建能快一大截。
      - uses: gradle/actions/setup-gradle@v4

      # 关键优化：把单测 / lint / 仪器测试编译 / nightly 构建合并成一次 gradlew 调用。
      # 配置阶段只跑一遍、Gradle daemon 全程复用，比拆成 4 次独立调用省 2-3 分钟冷启动。
      - name: 单测 + Lint + 构建 nightly（一次 gradlew）
        env:
          VAULT_RELEASE_KEYSTORE_BASE64: ${{ secrets.VAULT_RELEASE_KEYSTORE_BASE64 }}
          VAULT_RELEASE_STORE_PASSWORD: ${{ secrets.VAULT_RELEASE_STORE_PASSWORD }}
          VAULT_RELEASE_KEY_ALIAS: ${{ secrets.VAULT_RELEASE_KEY_ALIAS }}
          VAULT_RELEASE_KEY_PASSWORD: ${{ secrets.VAULT_RELEASE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "${VAULT_RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$VAULT_RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            export VAULT_RELEASE_STORE_FILE=release.keystore
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "未配置签名 secret，产出未签名包（无法安装，仅用于验证 R8 配置）"
            echo "signed=false" >> "$GITHUB_ENV"
          fi
          # 仪器测试只编译不运行（要设备，守住"还编得过"即可）。
          # :shared:jvmTest 里有 DiGraphSmokeTest——Koin 类型推断的错只有真启动才暴露，
          # 不能只意本地跑。
          ./gradlew :app:testDebugUnitTest :app:lint :app:assembleDebugAndroidTest :app:assembleNightly :shared:jvmTest --console=plain
          rm -f release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-apk
          path: app/build/outputs/apk/nightly/*.apk
          if-no-files-found: error

  # iOS：在 macOS runner 上编译 shared.framework + iosApp 壳，产出未签名 .ipa。
  # 未签名（CODE_SIGNING_ALLOWED=NO）——目的只是验证 iOS 构建链路，不装真机。
  #
  # 模拟器 boot 的坑（症状固定：Data Migration → Waiting on System App → Status=-1）：
  #   Xcode 26.3 + iOS 18 预建设备（macos-15）、Xcode 26 + iOS 26 设备（macos-26）、
  #   Xcode 16.4 + iOS 18 预建设备（macos-15）都复现过。三层对策，缺一不可：
  # 1. 锁 Xcode 16.4：链接靠升 CMP 1.12.0（修旧 Xcode 16 SDK 链接，core#3278），
  #    Xcode 26 的 CoreSimulator 在 GH 镜像上 boot 不可靠（runner-images#12777）。
  # 2. 设备用镜像预建的 iPhone 16e（OS 18.5）：cibuildwheel 在同镜像上实测可用
  #    （其 ios.py 的 2025-10 注释，同为 #12777 的规避）；旧 runtime 别碰。
  # 3. boot 耐心轮询：首次 boot 的 Data Migration 在 GH 镜像上慢且抖（#12777 的
  #    「磁盘性能问题」），单次 bootstatus 约一分多钟就报 Status=-1，但设备往往
  #    还在继续起——失败后继续等（oppi#23 的结论），15 分钟预算；别 shutdown/
  #    erase 重来（重启会重做迁移，还可能卡死 shutdown）。boot 前先杀掉 6g 堆的
  #    Gradle daemon 腾内存（runner 总共约 7G）。
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 锁定 Xcode 16.x（匹配 iOS 18 模拟器 runtime）
        run: |
          set -eu
          # 不能选"最新"：macos-15 镜像上最新稳定版已是 Xcode 26.x，它的 CoreSimulator
          # boot iOS 18 runtime 的设备必挂（见 job 注释）。16.4 是镜像默认版，
          # iOS 18.5 runtime + iPhone 15/16 设备与它配套。
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1 || true)
          if [ -z "${XCODE:-}" ]; then
            echo "::error::镜像上没有 Xcode 16.x 了（macos-15 镜像变了？请核对 runner-images）"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Kotlin/Native 编译器与依赖缓存（~/.konan）：首次要下载 1GB+，缓存后快一大截。
      # 迁移计划 §4.1 明确要求缓存，否则每次 20 分钟起步。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ios-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'shared/build.gradle.kts') }}
          restore-keys: |
            ios-${{ runner.os }}-

      # Release 框架的 23 分钟 K/N 链接是 iOS job 的绝对大头。这里只做**精确命中**缓存：
      # key 覆盖 shared 的全部源码/资源/schema/构建脚本与依赖版本，App-only 改动或同一
      # commit 重跑都能直接复用；不做 restore-keys，避免把旧框架拿来占空间还要重链。
      # .gradle 里的 taskHistory 是 Gradle 判断 linkReleaseFrameworkIosArm64 是否
      # UP-TO-DATE 的必要条件，只缓存产物本身不够。
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/master'
        with:
          path: |
            .gradle
            shared/build/bin/iosArm64/releaseFramework
            shared/build/xcode-frameworks/Release
          key: ios-release-framework-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/build.gradle.kts', 'shared/schemas/**', 'shared/src/**') }}

      - uses: gradle/actions/setup-gradle@v4

      # K/N 链 Release 框架（整个 Compose UI + Room + miuix）比仓库级 4g 堆吃得还多。
      # 用户级 gradle.properties 优先于仓库级，且只影响本 job（ubuntu 的 build job 不受牵连）。
      - name: 拾高 Gradle 堆（iOS 链接需要）
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8\n' > ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      # 4.1 编译验证：先确认 shared 能编过 iOS（arm64 真机 + 模拟器），
      # 再跑模拟器测试（不需要签名）。这一步尽早暴露 iOS 侧编译问题，
      # 别等 xcodebuild archive 那一步才发现。
      - name: iOS 编译验证 + 模拟器测试
        run: |
          set -eu
          ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 :shared:iosSimulatorArm64Test --console=plain

      # 模拟器 UI 冒烟：装上真的启动一次。锁屏首帧、Koin 启动、Room 开库这些
      # 只有真跑才能暴露（链接器死消除没了、单测又从不走这些路）。
      # 启动后 25 秒进程还在 → 存活；否则抓崩溃报告并直接红。
      - name: 模拟器 UI 冒烟（启动 + 存活检查）
        run: |
          set -euo pipefail
          cd iosApp
          mkdir -p build
          # 选设备：优先镜像预建的 iPhone 16e（OS 18.5）——cibuildwheel 在同一镜像上
          # 实测可用（其 ios.py 的 2025-10 注释，针对 runner-images#12777 的规避）；
          # 其次 18.5 上的任意预建 iPhone；都没有就新建一台。runtime 锁 18.5
          # （Xcode 16.4 配套），别碰给旧 Xcode 装的 18.0~18.4 和 iOS 26。
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; c=[v for k,vs in d.items() if 'iOS-18-5' in k for v in vs if 'iPhone' in v['name']]; c.sort(key=lambda v: 0 if v['name']=='iPhone 16e' else 1); print(c[0]['udid'] if c else '', end='')")
          if [ -n "$UDID" ]; then
            echo "选用预建模拟器 UDID: $UDID"
          else
            RT=$(xcrun simctl list runtimes -j | python3 -c "import sys,json; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable')]; rt=next((r for r in rs if r.get('version')=='18.5'), next((r for r in rs if str(r.get('version','')).startswith('18.')), None)); print(rt['identifier']) if rt else sys.exit('没有可用的 iOS 18.x runtime')")
            DT=$(xcrun simctl list devicetypes -j | python3 -c "import sys,json; ts=json.load(sys.stdin)['devicetypes']; dt=next((t for t in ts if t.get('name')=='iPhone 16'), next((t for t in ts if 'iPhone' in t.get('name','')), None)); print(dt['identifier']) if dt else sys.exit('没有 iPhone 设备类型')")
            echo "没有合适的预建设备，新建： runtime=$RT devicetype=$DT"
            UDID=$(xcrun simctl create ci-smoke "$DT" "$RT")
            echo "新建模拟器 UDID: $UDID"
          fi
          # 全量日志落盘：管道 tail 会吃掉 xcodebuild 的退出码，上次就把真错误藏了
          if ! xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build/SimDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build > build/sim-build.log 2>&1; then
            tail -100 build/sim-build.log
            exit 1
          fi
          APP=build/SimDerivedData/Build/Products/Debug-iphonesimulator/iosApp.app
          # 先杀 Gradle daemon 再 boot：本 job 给 daemon 配了 6g 堆，而 macos runner
          # 总共约 7G 内存，boot 前把内存腾干净（收尾日志里一直能看到孤儿 java 进程）。
          (cd .. && ./gradlew --stop)
          # boot 等待：GH 镜像上首次 boot 的 Data Migration 慢且抖（#12777 的「磁盘
          # 性能问题」），单次 bootstatus 约一分多钟就报 Status=-1 终止，但设备
          # 常常还在继续起。oppi 项目的结论（oppi#23）：失败后继续等，
          # **别 shutdown/erase 重来**（重启会重做迁移，还可能卡死 shutdown）。
          # 这里轮询设备状态：Booted 且 bootstatus 通过才算就绪，15 分钟预算。
          sim_state() {
            xcrun simctl list devices -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; s=[v['state'] for vs in d.values() for v in vs if v['udid']=='$UDID']; print(s[0] if s else 'unknown', end='')" || echo unknown
          }
          xcrun simctl boot "$UDID" 2>/dev/null || true
          ok=0
          last=""
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            st=$(sim_state)
            if [ "$st" != "$last" ]; then echo "模拟器状态： ${st}（已等 ${SECONDS}s）"; last="$st"; fi
            case "$st" in
              Booted)
                if xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1; then ok=1; break; fi ;;
              Shutdown)
                xcrun simctl boot "$UDID" 2>/dev/null || true ;;
            esac
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::模拟器 15 分钟内没就绪（见上面的状态轨迹）"
            xcrun simctl list devices || true
            xcrun simctl list runtimes || true
            exit 1
          fi
          echo "模拟器就绪 ✓"
          xcrun simctl install "$UDID" "$APP"
          # --console-pty 让 Kotlin/Native 的未捕获异常直接落到文件。系统 log/crash report
          # 对 K/N 崩溃经常是空手而归；首行可能晚到，所以用轮询而不是同步 grep（set -e）。
          rm -f build/ios-sim-console.log
          xcrun simctl launch --console-pty "$UDID" com.lc33.tokenvault \
            > build/ios-sim-console.log 2>&1 &
          CONSOLE_PID=$!
          PID=""
          for _ in $(seq 1 20); do
            PID=$(sed -nE 's/.*: ([0-9]+)[[:space:]]*$/\1/p' build/ios-sim-console.log | tail -1)
            [ -n "$PID" ] && break
            sleep 1
          done
          echo "启动 pid: ${PID:-<未拿到>}"
          if [ -z "${PID:-}" ]; then
            echo "::error::launch 没返回 pid（bundle id 错了？）"
            wait "$CONSOLE_PID" || true
            tail -200 build/ios-sim-console.log || true
            exit 1
          fi
          sleep 25
          if [ -n "${PID:-}" ] && ps -p "$PID" > /dev/null 2>&1; then
            echo "应用启动后仍存活 ✓"
            # --console-pty 的父进程在应用存活时不会自行退出；强杀后 wait 只回收本
            # shell 记录的进程，避免冒烟成功反而卡在日志附加器上。
            kill -9 "$CONSOLE_PID" 2>/dev/null || true
            wait "$CONSOLE_PID" 2>/dev/null || true
            # cwd 已在 iosApp/ 里，路径写 build/…（修复：以前写成 iosApp/build/…
            # 落到 iosApp/iosApp/build/，截图 artifact 从没上传成功过）
            xcrun simctl io "$UDID" screenshot build/ios-sim-smoke.png || true
          else
            echo "::error::应用启动后退出（崩溃），pid： $PID"
            # Kotlin/Native 未捕获异常会先出现在 --console-pty 输出里；这是 crash report
            # 缺失时唯一可靠的现场，先打出来再查系统侧报告。
            wait "$CONSOLE_PID" || true
            echo "--- 应用控制台（末尾 200 行）---"
            tail -200 build/ios-sim-console.log || true
            # 崩溃报告：两处目录里最近 5 分钟的 .ips 全部列出（不只按进程名猜）
            SIMLOGS="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/DiagnosticReports"
            found=0
            for f in $(find "$HOME/Library/Logs/DiagnosticReports" "$SIMLOGS" -name '*.ips' -mmin -5 2>/dev/null | head -3); do
              echo "--- 崩溃报告： $f ---"
              head -c 6000 "$f"
              echo
              found=1
            done
            [ "$found" = 1 ] || echo "（没找到崩溃报告）"
            # 进程日志：滤掉 FrontBoard/runningboard 的噪音，tail 才能落到死亡瞬间
            echo "--- 进程日志（去噪后末尾 80 行）---"
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "iosApp"' --style compact 2>/dev/null \
              | grep -viE 'FrontBoard|SceneExtension|runningboard|BoardServices|xpc:|UIKit:UIScreen' | tail -80
            exit 1
          fi
          # 存活也要把我们的进程日志里的错误打出来（非致命异常未必杀进程）
          xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "iosApp"' --style compact 2>/dev/null | grep -iE 'error|fault|crash|exception' | head -30 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-sim-smoke-logs
          path: |
            iosApp/build/ios-sim-smoke.png
            iosApp/build/ios-sim-console.log
          if-no-files-found: ignore

      # PR 不产 nightly IPA；这 23 分钟的 Release 链接只留给 master / 手动触发。
      - name: xcodebuild 无签名构建（含 shared.framework）
        if: github.ref == 'refs/heads/master'
        run: |
          set -eu
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/iosApp.xcarchive \
            archive

      - name: 打包未签名 .ipa
        if: github.ref == 'refs/heads/master'
        run: |
          set -eu
          APP=iosApp/build/iosApp.xcarchive/Products/Applications/iosApp.app
          mkdir -p iosApp/build/ipa/Payload
          cp -R "$APP" iosApp/build/ipa/Payload/
          cd iosApp/build/ipa
          zip -r -y ../TokenVault-unsigned.ipa Payload
          echo "产出：iosApp/build/TokenVault-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master'
        with:
          name: nightly-ipa
          path: iosApp/build/TokenVault-unsigned.ipa
          if-no-files-found: error

  # 汇总 APK + IPA，一起挂到 nightly-build 预发布。
  release:
    needs: [build, ios]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 发布 nightly 预发布（APK + IPA）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apk=$(find artifacts/nightly-apk -name '*.apk' | head -n 1)
          ipa=$(find artifacts/nightly-ipa -name '*.ipa' | head -n 1)
          files=()
          [ -n "$apk" ] && files+=("$apk")
          [ -n "$ipa" ] && files+=("$ipa")
          # 预发布 tag 用带秒级时间戳的 `nightly-YYYYMMDD-HHMMSS`，每次构建唯一。
          # 原因：固定名会被仓库 ref 保护规则锁死；以前只用日期，同一天多次构建
          # 会因 tag 已存在而报错（GH release 不允许重复 tag）。秒级时间戳彻底避免。
          tag="nightly-$(date -u '+%Y%m%d-%H%M%S')"
          gh release create "$tag" "${files[@]}" \
            --prerelease --title "$tag" \
            --notes "自动构建于 $GITHUB_SHA（$(date -u '+%Y-%m-%d %H:%M UTC')）"
